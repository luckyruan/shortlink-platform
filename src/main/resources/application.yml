server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: shortlink-platform
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/shortlink;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 300ms
      connect-timeout: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

short-link:
  base-url: ${BASE_URL:http://localhost:8080/r/}
  code-length: ${CODE_LENGTH:8}
  cache-ttl: ${CACHE_TTL:24h}
  negative-cache-ttl: ${NEGATIVE_CACHE_TTL:1m}
  create-limit-per-minute: ${CREATE_LIMIT_PER_MINUTE:60}
  counter-flush-interval-ms: ${COUNTER_FLUSH_INTERVAL_MS:5000}
